services:
  - type: web
    name: menya-neza-ai-api
    runtime: python
    plan: free
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: MENYA_NEZA_CORS_ORIGINS
        sync: false
